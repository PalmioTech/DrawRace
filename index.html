<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Mobile-first: lock zoom, fill viewport incl. notch areas, no overscroll. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#05060f" />
    <title>Project Racing</title>
    <!-- Display + UI fonts (neon / racing feel). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Saira:wght@200;300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #05060f;
        overflow: hidden;
        /* Disable browser touch gestures so drawing feels native. */
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        overscroll-behavior: none;
      }
      #game {
        width: 100%;
        height: 100%;
      }
      /* Landscape-only: in portrait, hide the game and ask the user to rotate. */
      #rotate {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #05060f;
        color: #eef2fb;
        font-family: 'Saira', sans-serif;
        text-align: center;
        padding: 0 24px;
      }
      #rotate .ico {
        font-size: 64px;
        animation: spin 2.2s ease-in-out infinite;
      }
      #rotate .t {
        font-size: 22px;
        font-weight: 600;
        color: #2e7bff;
        letter-spacing: 3px;
      }
      #rotate .s {
        font-size: 15px;
        color: #8a90b8;
      }
      @keyframes spin {
        0%, 40% { transform: rotate(0deg); }
        60%, 100% { transform: rotate(90deg); }
      }
      @media (orientation: portrait) {
        #game { display: none; }
        #rotate { display: flex; }
      }

      /* ---- Fun neon loading screen (shown until the game boots) ---- */
      #loader {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 26px;
        background: radial-gradient(circle at 50% 35%, #0b1226 0%, #05070e 72%);
        font-family: 'Saira', sans-serif;
        transition: opacity 0.45s ease;
      }
      #loader.hide {
        opacity: 0;
        pointer-events: none;
      }
      #loader h1 {
        margin: 0;
        font-family: 'Saira', sans-serif;
        font-weight: 700;
        font-size: 46px;
        letter-spacing: 8px;
        color: #eef2fb;
        text-shadow: 0 0 24px rgba(46, 123, 255, 0.5);
        animation: pulse 1.8s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.85; }
        50% { opacity: 1; text-shadow: 0 0 26px rgba(45, 226, 230, 0.95); }
      }
      /* A neon lane with a car zooming across, leaving a trail. */
      #loader .lane {
        position: relative;
        width: 280px;
        height: 46px;
        border-top: 2px dashed rgba(138, 144, 184, 0.5);
        border-bottom: 2px dashed rgba(138, 144, 184, 0.5);
        overflow: hidden;
      }
      #loader .car {
        position: absolute;
        top: 4px;
        font-size: 30px;
        animation: drive 1.7s cubic-bezier(0.45, 0, 0.55, 1) infinite;
      }
      #loader .car::before {
        content: '';
        position: absolute;
        right: 26px;
        top: 16px;
        width: 64px;
        height: 6px;
        border-radius: 3px;
        background: linear-gradient(to left, #2e7bff, rgba(46, 123, 255, 0));
        filter: blur(1px);
      }
      @keyframes drive {
        0% { left: -44px; }
        100% { left: 300px; }
      }
      /* Cross-fading playful messages. */
      #loader .msgs {
        position: relative;
        height: 22px;
        width: 320px;
        text-align: center;
      }
      #loader .msgs span {
        position: absolute;
        inset: 0;
        color: #8a90b8;
        font-size: 16px;
        opacity: 0;
        animation: msg 6s linear infinite;
      }
      #loader .msgs span:nth-child(2) { animation-delay: 2s; }
      #loader .msgs span:nth-child(3) { animation-delay: 4s; }
      @keyframes msg {
        0%, 33% { opacity: 1; }
        40%, 100% { opacity: 0; }
      }
    </style>
  </head>
  <body>
    <div id="loader">
      <h1>PROJECT RACING</h1>
      <div class="lane"><span class="car">🏎️</span></div>
      <div class="msgs">
        <span>Scaldando i motori…</span>
        <span>Disegnando le curve…</span>
        <span>Gonfiando le gomme…</span>
      </div>
    </div>
    <div id="game"></div>
    <div id="rotate">
      <div class="ico">📱</div>
      <div class="t">RUOTA IL DISPOSITIVO</div>
      <div class="s">gioca in orizzontale</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
